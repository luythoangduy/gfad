# @package app
meta:
  model: 'dinov3'
  crop_size: 512
  pred_depth: 6
  pred_emb_dim: 384
  use_bfloat16: false
  if_pred_pe: false
  n_layer: 3
  feat_normed: false
  loss_mode: 'l2'  # l2 or smooth_l1
  weights: null  # required for dinov3; local path or URL
  predictor_type: gated_self_attention  # gated_self_attention (legacy) | neighbor_masked_cross_attention
  neighbor_masked_attention:
    mask_radius: 1
    num_heads: 12
    mlp_ratio: 4.0
    attn_drop: 0.0
    proj_drop: 0.0
    use_query_pos: true
  gated_attention:
    enabled: false
    mode: multiplication  # multiplication, residual, or memory
    positions: [attn_output]  # pre_qkv, q, k, v, attn_output, proj_output, or [all]
    granularity: elementwise  # elementwise, headwise, or token
    activation: sigmoid
    init_bias: 0.0
    memory_type: self  # self (original) | patch_mean (image-level mean as gate reference)

logging:
  folder: logs/${data.data_name}/${app.meta.model}${oc.select:diy_name,""}
  write_tag: train

wandb:
  enabled: true
  project: "foundad"
  entity: null
  access_token: "YOUR_WANDB_API_KEY"
  name: null
