# @package app
meta:
  model: 'dinov3'
  crop_size: 512
  pred_depth: 6
  pred_emb_dim: 384
  use_bfloat16: false
  if_pred_pe: true
  n_layer: 3
  feat_normed: false
  loss_mode: 'smooth_l1'  # l2 or smooth_l1
  weights: null  # required for dinov3; local path or URL
  backbone_lora:
    enabled: true
    layers: all  # all, last, last_N, an int, or a list of block indices
    rank: 16
    alpha: 16.0
    dropout: 0.0
  ijepa_mask:
    allow_overlap: false
    aspect_ratio: [0.75, 1.5]
    enc_mask_scale: [0.85, 1.0]
    pred_mask_scale: [0.15, 0.2]
    num_enc_masks: 1
    num_pred_masks: 4
    min_keep: 10
    target_layer_norm: true
  gated_attention:
    enabled: false
    mode: multiplication  # multiplication or residual
    positions: [attn_output]  # pre_qkv, q, k, v, attn_output, proj_output, or [all]
    granularity: elementwise  # elementwise, headwise, or token
    activation: sigmoid
    init_bias: 0.0
    supervision:
      enabled: false
      loss_weight: 0.1
      anomaly_weight: 4.0
      positions: null  # null supervises all active gate positions

logging:
  folder: logs/${data.data_name}/${app.meta.model}${oc.select:diy_name,""}
  write_tag: train
