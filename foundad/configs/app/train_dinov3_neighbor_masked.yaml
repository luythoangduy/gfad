# @package app
# Same as train_dinov3.yaml but selects the NeighborMaskedCrossAttentionPredictor,
# which prevents identity-shortcut leakage by masking out patch i and its
# mask_radius neighborhood from the context a predictor can attend to when
# reconstructing patch i. Everything else (encoder, loss, optimizer, Top-K,
# evaluation, post-processing) is unchanged.
meta:
  model: 'dinov3'
  crop_size: 512
  pred_depth: 6
  pred_emb_dim: 384
  use_bfloat16: false
  if_pred_pe: false
  n_layer: 3
  feat_normed: false
  loss_mode: 'l2'  # l2 or smooth_l1
  weights: null  # required for dinov3; local path or URL
  predictor_type: neighbor_masked_cross_attention  # gated_self_attention (legacy) | neighbor_masked_cross_attention
  neighbor_masked_attention:
    mask_radius: 1
    num_heads: 12
    mlp_ratio: 4.0
    attn_drop: 0.0
    proj_drop: 0.0
    use_query_pos: true
  gated_attention:
    enabled: false

logging:
  # Deliberately distinct from train_dinov3.yaml's folder: the two
  # predictors have different architectures/state_dicts, so they must never
  # share a checkpoint directory (train-step*.pth.tar / params.yaml would
  # otherwise silently overwrite each other across runs). Override
  # `neighbor_masked_attention.mask_radius` for ablations and this path
  # picks up the new radius automatically; `diy_name` still adds further
  # disambiguation on top (e.g. diy_name=_seed1).
  folder: logs/${data.data_name}/${app.meta.model}_neighbor_masked_r${app.meta.neighbor_masked_attention.mask_radius}${oc.select:diy_name,""}
  write_tag: train
